<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FloodMetric North Carolina</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">F</span><b>FloodMetric</b><span class="chip">North Carolina</span></div>
  <span class="chip">Prototype with mock data</span>
</header>

<div class="grid">
  <!-- Left sidebar: vulnerability metrics -->
  <aside class="col">
    <section class="card">
      <h1>Vulnerability metrics</h1>
      <label for="storm" class="muted">Storm filter</label>
      <select id="storm"></select>
    </section>
    <section class="kpis" id="kpis"></section>
    <section class="card"><h2>Highest PPI sites</h2><ol id="top" class="top5"></ol></section>
    <section class="card"><h2>Sites by infrastructure type</h2><div id="types"></div></section>
  </aside>

  <!-- Center: map with layer stack control -->
  <main class="card map-card">
    <div class="layers" id="layers" role="group" aria-label="Map view">
      <button data-view="history" class="on"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12l9 5 9-5M3 16l9 5 9-5"/></svg><span>Historical failure patterns</span></button>
      <button data-view="exposure"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12l9 5 9-5M3 16l9 5 9-5"/></svg><span>Flood exposure</span></button>
      <button data-view="ppi"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12l9 5 9-5M3 16l9 5 9-5"/></svg><span>Predictive Priority Index</span></button>
    </div>
    <div id="map" role="region" aria-label="Map of North Carolina infrastructure sites"></div>
    <div class="legend" id="legend"></div>
  </main>

  <!-- Right sidebar: 311 logs -->
  <aside class="card side">
    <h2>Live 311 community observations</h2>
    <p class="scope" id="scope"></p>
    <div id="logs"></div>
    <p class="muted">Simulated entries. Reports are unverified and do not show structural damage.</p>
  </aside>
</div>

<script src="mock_data.js"></script>
<script src="app.js"></script>
</body>
</html>
